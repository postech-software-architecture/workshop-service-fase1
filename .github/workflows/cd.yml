name: CD — Deploy to EKS (AWS Academy)

# Deploy no EKS provisionado pelo repositorio workshop-infra-kubernetes (AWS Academy).
# A imagem vem do GHCR (publicada pelo ci.yml). As credenciais da AWS Academy sao
# TEMPORARIAS (expiram em algumas horas) e incluem SESSION TOKEN — por isso ficam em
# GitHub Secrets e precisam ser renovadas quando a sessao do Lab reinicia.
#
# Secrets necessarios (Settings > Secrets and variables > Actions):
#   AWS_ACCESS_KEY_ID       (Academy)
#   AWS_SECRET_ACCESS_KEY   (Academy)
#   AWS_SESSION_TOKEN       (Academy — obrigatorio, credencial temporaria)
#   DB_HOST                 (output `db_host` do repositorio workshop-infra-database)
#   DB_USER
#   DB_PASSWORD
#   JWT_SECRET              (openssl rand -hex 32)
#   WEBHOOK_ORCAMENTO_TOKEN
#   MAIL_USERNAME
#   MAIL_PASSWORD
# Variables (opcionais — tem default):
#   AWS_REGION   (default us-east-1)
#   EKS_CLUSTER  (default workshop-eks)
#   DB_NAME      (default workshop; output `db_name` do repo de banco)
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag imutavel da imagem no GHCR (sha-<sha>)'
        required: true
      confirmacao:
        description: 'Digite DEPLOY para confirmar o deploy manual em prod'
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/workshop-service
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER_NAME || 'workshop-eks' }}
  DB_NAME: ${{ vars.DB_NAME || 'workshop' }}
  NAMESPACE: workshop

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    # Na W3, o deploy e deliberadamente manual e so pode usar a branch main.
    # A infraestrutura deve existir na ordem cluster -> database -> app.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmacao == 'DEPLOY' }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Valida secrets obrigatorios
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          DB_HOST: ${{ secrets.DB_HOST }}
        run: |
          missing=""
          [ -z "$AWS_ACCESS_KEY_ID" ]     && missing="$missing AWS_ACCESS_KEY_ID"
          [ -z "$AWS_SECRET_ACCESS_KEY" ] && missing="$missing AWS_SECRET_ACCESS_KEY"
          [ -z "$AWS_SESSION_TOKEN" ]     && missing="$missing AWS_SESSION_TOKEN"
          [ -z "$DB_HOST" ]               && missing="$missing DB_HOST"
          if [ -n "$missing" ]; then
            echo "::error::Secrets ausentes:$missing. Renove as credenciais da AWS Academy e reconfigure os secrets."
            exit 1
          fi

      - name: Configura credenciais AWS (temporarias)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'

      - name: Gera kubeconfig do EKS
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
          kubectl config current-context

      - name: Garante o namespace
        run: kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Cria/atualiza o Secret da aplicacao
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WEBHOOK_ORCAMENTO_TOKEN: ${{ secrets.WEBHOOK_ORCAMENTO_TOKEN }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          kubectl -n "$NAMESPACE" create secret generic workshop-secret \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=WEBHOOK_ORCAMENTO_TOKEN="$WEBHOOK_ORCAMENTO_TOKEN" \
            --from-literal=MAIL_USERNAME="$MAIL_USERNAME" \
            --from-literal=MAIL_PASSWORD="$MAIL_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Injeta o contrato do RDS no overlay
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ env.DB_NAME }}
        run: |
          sed -i "s|^DB_HOST=.*|DB_HOST=${DB_HOST}|" k8s/overlays/aws/config.env
          sed -i "s|^DB_NAME=.*|DB_NAME=${DB_NAME}|" k8s/overlays/aws/config.env
          grep -E '^DB_(HOST|NAME)=' k8s/overlays/aws/config.env

      - name: Valida a tag e injeta a versao de telemetria
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "::error::image_tag deve ser imutavel e usar o formato sha-<sha>."
            exit 1
          fi
          sed -i "s|service.version=[^,]*|service.version=${IMAGE_TAG}|" k8s/overlays/aws/config.env
          grep '^OTEL_RESOURCE_ATTRIBUTES=' k8s/overlays/aws/config.env

      - name: Aplica os manifestos (overlay aws)
        run: kubectl apply -k k8s/overlays/aws

      - name: Injeta a tag imutavel da imagem
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          echo "Deploying ${IMAGE}:${IMAGE_TAG}"
          kubectl -n "$NAMESPACE" set image deployment/workshop-service \
            workshop-service="${IMAGE}:${IMAGE_TAG}"

      - name: Aguarda rollout
        run: kubectl -n "$NAMESPACE" rollout status deployment/workshop-service --timeout=300s

      - name: URL publica (ELB)
        run: |
          echo "LoadBalancer:"
          kubectl -n "$NAMESPACE" get svc workshop-api \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' || true
          echo
