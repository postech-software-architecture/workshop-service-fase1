name: CI — Integration Tests and Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build and run integration tests + coverage
        run: |
          chmod +x mvnw
          # Pula os testes de unidade (suﬁre) e executa os testes de integração (failsafe)
          # Coverage check is executed via the plugin bound to the 'verify' phase
          ./mvnw -B -V -DskipTests verify

