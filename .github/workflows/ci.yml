name: CI — Build, Tests & Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/workshop-service

jobs:
  build-and-test:
    name: Build, test (unit + integration) and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validar NLB interno do overlay AWS
        shell: bash
        run: |
          grep -q 'service.beta.kubernetes.io/aws-load-balancer-scheme: internal' \
            k8s/overlays/aws/service-lb.yaml || {
              echo '::error::O Load Balancer do overlay AWS deve ser internal.'
              exit 1
            }
          ! grep -R -q 'internet-facing' k8s/overlays/aws || {
            echo '::error::O overlay AWS nao pode usar internet-facing.'
            exit 1
          }
          grep -q 'service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip' \
            k8s/overlays/aws/service-lb.yaml || exit 1
          grep -q 'service.beta.kubernetes.io/aws-load-balancer-name: workshop-api-internal' \
            k8s/overlays/aws/service-lb.yaml || exit 1
          ! find k8s/overlays/aws -iname '*ingress*' -type f | grep -q . || {
            echo '::error::O overlay AWS nao deve adicionar Ingress.'
            exit 1
          }

      # O README do overlay manda reescrever DB_HOST no proprio config.env, que e
      # um arquivo versionado. Um 'git add .' distraido publica o endpoint real do
      # RDS num repositorio publico. O CD sobrescreve esse valor a partir do secret
      # DB_HOST, entao o commitado deve permanecer sempre o placeholder.
      - name: Impedir endpoint real do RDS versionado
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^DB_HOST=REPLACE_WITH_RDS_ENDPOINT$' k8s/overlays/aws/config.env || {
            echo '::error file=k8s/overlays/aws/config.env::DB_HOST versionado deve ser REPLACE_WITH_RDS_ENDPOINT. O valor real entra no deploy a partir do secret DB_HOST.'
            exit 1
          }
          if grep -REn '[a-z0-9-]+\.[a-z0-9]{10,}\.[a-z0-9-]+\.rds\.amazonaws\.com' k8s/; then
            echo '::error::Endpoint real de RDS encontrado nos manifestos. Use o placeholder; o valor real vem do secret no deploy.'
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Build, test and verify coverage
        run: |
          chmod +x mvnw
          # 'verify' roda surefire (unit) + failsafe (IT) + jacoco-check (>=80%).
          ./mvnw -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  build-image:
    name: Build & push image (GHCR)
    needs: build-and-test
    # Publica a imagem apenas em push na main; em PR o job nao roda.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
