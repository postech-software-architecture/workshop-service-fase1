services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - workshop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  workshop-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: workshop-service:local
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-mydatabase}
      DB_USER: ${POSTGRES_USER:-myuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workshop-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres-sonar:
    image: 'postgres:15-alpine'
    environment:
      - 'POSTGRES_DB=sonarqube'
      - 'POSTGRES_PASSWORD=sonar_secret'
      - 'POSTGRES_USER=sonaruser'
    ports:
      - '5434:5432'
    volumes:
      - postgres_sonar_data:/var/lib/postgresql/data

  sonarqube:
    image: 'sonarqube:community'
    environment:
      - 'SONAR_JDBC_URL=${SONAR_JDBC_URL}'
      - 'SONAR_JDBC_USERNAME=${SONAR_JDBC_USERNAME}'
      - 'SONAR_JDBC_PASSWORD=${SONAR_JDBC_PASSWORD}'
    ports:
      - '9000:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      - postgres-sonar

volumes:
  postgres-data:
  postgres_sonar_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  workshop-network:
    driver: bridge
