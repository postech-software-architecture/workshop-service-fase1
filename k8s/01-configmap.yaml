apiVersion: v1
kind: ConfigMap
metadata:
  name: workshop-config
  namespace: workshop
  labels:
    app.kubernetes.io/name: workshop-service
    app.kubernetes.io/part-of: workshop-service
data:
  SPRING_PROFILES_ACTIVE: "docker"
  # Banco — Opcao A (Postgres in-cluster): DB_HOST e o nome do Service "postgres".
  # Opcao B (banco do Dev 4): trocar DB_HOST pelo endpoint externo (RDS/Cloud SQL) e ajustar
  # DB_NAME conforme o output do Terraform. Manter coerencia com o Secret.
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "mydatabase"
  # --- Contrato Dev 1 (features de notificacao) — nao sensivel ---
  MAIL_HOST: "mailhog"
  MAIL_PORT: "1025"
  MAIL_FROM: "no-reply@workshop.local"
  # Canal de notificacao: "log" (default dev) ou "email" (envio real via SMTP).
  NOTIFICACAO_CANAL: "log"
