# TEMPLATE — copie para k8s/02-secret.yaml, preencha os valores e NAO commite o arquivo real
# (k8s/02-secret.yaml esta no .gitignore). Alternativa: criar via CI com `kubectl create secret`
# a partir dos GitHub Actions Secrets (ver k8s/README.md).
#
# stringData aceita texto puro; o Kubernetes codifica em base64 no armazenamento (encoding,
# NAO criptografia — por isso valores reais nunca vao ao git).
apiVersion: v1
kind: Secret
metadata:
  name: workshop-secret
  namespace: workshop
  labels:
    app.kubernetes.io/name: workshop-service
    app.kubernetes.io/part-of: workshop-service
type: Opaque
stringData:
  # Banco (Opcao A: mesmos defaults do application-docker.yaml/compose; Opcao B: valores do Dev 4)
  DB_USER: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
  # Gerar com: openssl rand -hex 32
  JWT_SECRET: "CHANGE_ME_64_hex_chars"
  # --- Contrato Dev 1 (sensivel) ---
  WEBHOOK_ORCAMENTO_TOKEN: "CHANGE_ME"
  MAIL_USERNAME: "CHANGE_ME"
  MAIL_PASSWORD: "CHANGE_ME"
