apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente AWS (Academy / EKS): o banco e o RDS provisionado em workshop-infra-database.
# NAO sobe Postgres in-cluster — o DB_HOST aponta para o endpoint do RDS.
namespace: workshop

resources:
  - ../../base
  - service-lb.yaml # expoe a API via NLB interno (so na AWS)

configMapGenerator:
  - name: workshop-config
    envs:
      - config.env

generatorOptions:
  disableNameSuffixHash: true

# O Secret "workshop-secret" NAO e gerado aqui de proposito: credenciais de nuvem nao vao
# ao git. Crie-o com as credenciais configuradas para o deploy ANTES do apply
# (ver README.md deste diretorio).
