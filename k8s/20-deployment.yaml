apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-service
  namespace: workshop
  labels:
    app.kubernetes.io/name: workshop-service
    app.kubernetes.io/part-of: workshop-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: workshop-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workshop-service
        app.kubernetes.io/part-of: workshop-service
    spec:
      containers:
        - name: workshop-service
          # Contrato Dev 2 — o CD substitui pela tag imutavel (sha-<sha>) publicada no GHCR.
          # Para teste local com kind/minikube, usar "workshop-service:local" e
          # imagePullPolicy IfNotPresent.
          image: ghcr.io/postech-software-architecture/workshop-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
          envFrom:
            - configMapRef:
                name: workshop-config
            - secretRef:
                name: workshop-secret
          resources:
            # requests sao obrigatorios para o HPA por utilizacao (base de calculo).
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # startupProbe protege o boot lento (Spring + Flyway migrando). Ate ~150s.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # UID/GID numericos do usuario "spring" da imagem (Dockerfile do Dev 2). Sem o UID
            # numerico o kubelet nao consegue verificar runAsNonRoot (imagem usa nome, nao UID).
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
      # Se a imagem for privada no GHCR, criar o secret ghcr-pull (ver k8s/README.md) e
      # descomentar:
      # imagePullSecrets:
      #   - name: ghcr-pull
