apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workshop-service
  namespace: workshop
  labels:
    app.kubernetes.io/name: workshop-service
    app.kubernetes.io/part-of: workshop-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workshop-service
  minReplicas: 2
  maxReplicas: 10
  # O HPA escala pelo MAIOR sinal entre CPU e memoria.
  metrics:
    # CPU (metrica primaria): reflete a demanda real de carga.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Memoria (rede de seguranca): AverageValue ABSOLUTO em vez de Utilization de proposito.
    # A JVM reserva ~MaxRAMPercentage=75% do limit (1Gi -> ~768Mi de heap) e segura, entao a
    # utilizacao relativa ao request (512Mi) ficaria cronicamente >100% e travaria o HPA no
    # maximo. Um alvo absoluto proximo ao limit so dispara sob pressao real de memoria.
    - type: Resource
      resource:
        name: memory
        target:
          type: AverageValue
          averageValue: 850Mi
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
