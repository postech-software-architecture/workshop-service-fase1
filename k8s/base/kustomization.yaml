apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base = recursos comuns a TODOS os ambientes.
# ConfigMap e Secret NAO ficam aqui: cada overlay (dev/aws) gera os seus, porque o que
# muda entre ambientes e justamente a config do banco (in-cluster x RDS) e os segredos.
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
