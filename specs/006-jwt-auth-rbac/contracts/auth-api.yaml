openapi: 3.0.3
info:
  title: API de Autenticacao
  version: 1.0.0
  description: Contrato dos endpoints de autenticacao, renovacao, logout e identificacao da sessao.
servers:
  - url: http://localhost:8080
paths:
  /api/auth/login:
    post:
      summary: Inicia sessao de usuario
      description: Aceita username ou email no campo `username` do payload.
      tags:
        - Autenticacao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              padrao:
                value:
                  username: admin
                  password: senha123
              porEmail:
                value:
                  username: admin@teste.com
                  password: senha123
      responses:
        '200':
          description: Sessao criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          description: Credenciais invalidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Payload invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/refresh:
    post:
      summary: Renova o access token a partir do refresh token
      description: A renovacao e rotativa e revoga o refresh token anterior da sessao.
      tags:
        - Autenticacao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Sessao renovada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
              examples:
                rotacao:
                  value:
                    accessToken: jwt-novo
                    refreshToken: refresh-token-novo
                    expiresIn: 3600
        '401':
          description: Refresh token expirado, inexistente ou revogado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Payload invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      summary: Encerra a capacidade de renovacao da sessao
      description: Revoga apenas a sessao identificada pelo refresh token enviado.
      tags:
        - Autenticacao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Refresh token revogado com sucesso
        '401':
          description: Refresh token invalido para logout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Payload invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/me:
    get:
      summary: Retorna a identidade da sessao autenticada
      tags:
        - Autenticacao
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessao autenticada encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Access token ausente ou invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/public/ordem-servico/rastreamento:
    get:
      summary: Recurso publico de rastreamento de ordem de servico
      tags:
        - Publico
      parameters:
        - in: query
          name: codigo
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rastreamento consultado
        '404':
          description: Ordem de servico nao encontrada
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    AuthTokensResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          format: int64
    MeResponse:
      type: object
      required:
        - id
        - username
        - roles
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
              - ADMINISTRADOR
              - ATENDENTE
              - MECANICO
              - CLIENTE
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
