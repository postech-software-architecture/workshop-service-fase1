    # ── Orçamentos ────────────────────────────────────────────────────────────

    StatusOrcamento:
      type: string
      enum: [CRIADO, PENDENTE_APROVACAO, APROVADO, REJEITADO, CANCELADO]

    TipoOrcamento:
      type: string
      enum: [SERVICO_ORIGINAL, ADICAO_SERVICO]

    ItemOrcamentoResponse:
      type: object
      description: Item cobrado no orçamento
      properties:
        descricao:
          type: string
          example: Troca de oleo
        valor:
          type: number
          example: 100.00

    OrcamentoResponse:
      type: object
      description: Dados completos do orçamento
      properties:
        id:
          type: string
          format: uuid
        idOrdemServico:
          type: string
          format: uuid
        valorTotal:
          type: number
          example: 310.00
        status:
          $ref: '#/components/schemas/StatusOrcamento'
        tipo:
          $ref: '#/components/schemas/TipoOrcamento'
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemOrcamentoResponse'
        dataCriacao:
          type: string
          format: date-time
        dataUltimaAtualizacao:
          type: string
          format: date-time

    # ── Métricas ──────────────────────────────────────────────────────────────

    TempoMedioExecucaoResponse:
      type: object
      properties:
        totalOrdens:
          type: integer
          format: int64
          example: 42
        tempoMedioExecucaoMinutos:
          type: number
          format: double
          example: 145.5
        tempoMinimoExecucaoMinutos:
          type: number
          format: double
          example: 30.0
        tempoMaximoExecucaoMinutos:
          type: number
          format: double
          example: 480.0

    TempoMedioPorTipoServicoResponse:
      type: object
      properties:
        descricaoServico:
          type: string
          example: Troca de oleo e filtro
        totalExecucoes:
          type: integer
          format: int64
          example: 8
        tempoMedioExecucaoMinutos:
          type: number
          format: double
          example: 45.0

    # ── Erro ──────────────────────────────────────────────────────────────────

    FieldErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: nome
        message:
          type: string
          example: O nome é obrigatório

    ErrorResponse:
      type: object
      description: Payload padrão de erro
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 422
        error:
          type: string
          example: Unprocessable Entity
        message:
          type: string
          example: Regra de negócio violada
        path:
          type: string
          example: /api/v1/clientes
        fieldErrors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/FieldErrorDetail'
