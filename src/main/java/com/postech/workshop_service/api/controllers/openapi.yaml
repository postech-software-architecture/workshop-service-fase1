  # ─── Ordens de Serviço ─────────────────────────────────────────────────────

  /api/v1/ordens-servico:
    post:
      tags: [Ordens de Serviço]
      summary: Abrir Ordem de Serviço
      description: >
        Restrito aos perfis ADMINISTRADOR e ATENDENTE. Registra a recepção do veículo,
        identifica o cliente, calcula o orçamento automaticamente e envia para aprovação.
        Se o veículo não existir no sistema, é cadastrado automaticamente com os dados informados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarOrdemServicoRequest'
            examples:
              com_servico_e_peca:
                summary: OS com serviço e peça
                value:
                  clienteDocumento: "123.456.789-09"
                  veiculoPlaca: "ABC1D23"
                  veiculo:
                    marca: "Toyota"
                    modelo: "Corolla"
                    ano: 2020
                  servicos:
                    - servicoId: "00000000-0000-0000-0000-000000000001"
                      quantidade: 1
                  pecas:
                    - pecaId: "00000000-0000-0000-0000-000000000002"
                      quantidade: 2.0
                  observacoes: "Cliente relatou barulho ao frear"
              veiculo_ja_cadastrado:
                summary: OS com veículo já existente
                value:
                  clienteDocumento: "98765432100"
                  veiculoPlaca: "XYZ9G87"
                  servicos:
                    - servicoId: "00000000-0000-0000-0000-000000000001"
                      quantidade: 1
      responses:
        '201':
          description: OS criada com sucesso — orçamento pendente de aprovação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponse'
        '400':
          description: Dados de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Cliente ou serviço não encontrado no sistema
        '422':
          description: >
            Regra de negócio violada:
            - veículo pertence a outro cliente
            - veículo não encontrado e dados para cadastro ausentes
            - estoque insuficiente para a peça solicitada
            - serviço inativo no catálogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Ordens de Serviço]
      summary: Listar Ordens de Serviço com filtros
      description: >
        Restrito aos perfis ADMINISTRADOR, ATENDENTE e MECANICO.
        Aplica filtros opcionais (status, cliente, intervalo de datas).
      parameters:
        - name: pagina
          in: query
          schema:
            type: integer
            default: 0
        - name: tamanho
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusOrdemServico'
        - name: idCliente
          in: query
          schema:
            type: string
            format: uuid
        - name: dataInicio
          in: query
          schema:
            type: string
            format: date-time
          description: Data mínima inclusiva de criação (ISO-8601)
        - name: dataFim
          in: query
          schema:
            type: string
            format: date-time
          description: Data máxima exclusiva de criação (ISO-8601)
      responses:
        '200':
          description: Página de ordens de serviço
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaOrdensServicoResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão

  /api/v1/ordens-servico/{id}:
    get:
      tags: [Ordens de Serviço]
      summary: Buscar Ordem de Serviço por id
      description: >
        Restrito aos perfis ADMINISTRADOR, ATENDENTE e MECANICO.
        Retorna o detalhe completo de uma OS com itens da composição técnica.
