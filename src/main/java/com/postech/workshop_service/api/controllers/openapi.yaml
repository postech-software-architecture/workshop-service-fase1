        observacoes:
          type: string
        dataCriacao:
          type: string
          format: date-time
        dataUltimaAtualizacao:
          type: string
          format: date-time
        orcamento:
          $ref: '#/components/schemas/OrcamentoResumoOSResponse'

    OrdemServicoResumoResponse:
      type: object
      description: Resumo de uma ordem de serviço para listagens
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          example: OS-2026-00001
        status:
          $ref: '#/components/schemas/StatusOrdemServico'
        idCliente:
          type: string
          format: uuid
        idVeiculo:
          type: string
          format: uuid
        dataCriacao:
          type: string
          format: date-time
        dataUltimaAtualizacao:
          type: string
          format: date-time

    PaginaOrdensServicoResponse:
      type: object
