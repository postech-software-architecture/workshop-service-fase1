openapi: 3.0.3
info:
  title: Workshop Service API
  description: API REST de gestão de oficina mecânica — Spring Boot 3.4.1
  version: 1.0.0

security:
  - bearerAuth: []

tags:
  - name: Autenticacao
    description: Fluxos de login, refresh, logout e identidade autenticada
  - name: Clientes
    description: Cadastro e gestão de clientes
  - name: Veículos
    description: Cadastro e gestão de veículos
  - name: Serviços
    description: Catálogo de serviços da oficina
  - name: Peças e Insumos
    description: Catálogo de peças e insumos
  - name: Estoques
    description: Controle de estoque e movimentações
  - name: Ordens de Serviço
    description: Gerenciamento do ciclo de vida das ordens de serviço
  - name: Orçamentos
    description: Aprovação, rejeição e cancelamento de orçamentos vinculados a ordens de serviço
  - name: Métricas
    description: Monitoramento do tempo médio de execução das ordens de serviço (perfil ADMINISTRADOR)

paths:

  # ─── Autenticação ─────────────────────────────────────────────────────────

  /api/auth/login:
    post:
      tags: [Autenticacao]
      summary: Autenticar usuário e emitir tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciais inválidas ou conta inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh:
    post:
      tags: [Autenticacao]
      summary: Renovar sessão autenticada
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens renovados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Refresh token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      tags: [Autenticacao]
      summary: Encerrar uma sessão autenticada
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Sessão encerrada
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags: [Autenticacao]
      summary: Consultar identidade autenticada
      responses:
        '200':
          description: Identidade autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAutenticadoResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Clientes ──────────────────────────────────────────────────────────────

  /api/v1/clientes:
    post:
      tags: [Clientes]
      summary: Cadastrar cliente
      description: Restrito aos perfis ADMINISTRADOR e ATENDENTE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroClienteRequest'
      responses:
        '201':
          description: Cliente cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '422':
          description: Regra de negócio violada (CPF/CNPJ duplicado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Clientes]
      summary: Listar clientes com paginação
      description: Restrito aos perfis ADMINISTRADOR e ATENDENTE.
      parameters:
        - name: pagina
          in: query
          schema:
            type: integer
            default: 0
          description: Página solicitada (base zero)
        - name: tamanho
          in: query
          schema:
            type: integer
            default: 20
          description: Quantidade de registros por página
        - name: incluirInativos
          in: query
          schema:
            type: boolean
            default: false
          description: Incluir clientes inativos no resultado
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClienteResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão

  /api/v1/clientes/{id}:
    get:
      tags: [Clientes]
      summary: Buscar cliente por ID
      description: Restrito aos perfis ADMINISTRADOR e ATENDENTE.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: incluirInativos
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Cliente não encontrado
    put:
      tags: [Clientes]
      summary: Atualizar dados do cliente
      description: Restrito aos perfis ADMINISTRADOR e ATENDENTE.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarClienteRequest'
      responses:
        '200':
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Cliente não encontrado
    delete:
      tags: [Clientes]
      summary: Remover cliente (remoção lógica)
      description: Restrito ao perfil ADMINISTRADOR.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Cliente removido
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão — requer perfil ADMINISTRADOR
        '404':
          description: Cliente não encontrado

  /api/v1/clientes/documento/{documento}:
    get:
      tags: [Clientes]
      summary: Buscar cliente por CPF ou CNPJ
      description: Restrito aos perfis ADMINISTRADOR e ATENDENTE.
      parameters:
        - name: documento
          in: path
          required: true
          schema:
            type: string
          description: CPF ou CNPJ com ou sem máscara
        - name: incluirInativos
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Cliente não encontrado

  /api/v1/clientes/me:
    get:
      tags: [Clientes]
      summary: Consultar o próprio cadastro do cliente autenticado
      description: Restrito ao perfil CLIENTE.
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão — requer perfil CLIENTE
        '404':
          description: Cadastro não encontrado para o usuário autenticado

  # ─── Veículos ──────────────────────────────────────────────────────────────

  /api/v1/veiculos:
    post:
      tags: [Veículos]
      summary: Cadastrar veículo
      description: Restrito aos perfis ADMINISTRADOR e ATENDENTE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroVeiculoRequest'
      responses:
        '201':
          description: Veículo cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeiculoResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '422':
          description: Placa duplicada ou cliente vinculado inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Veículos]
      summary: Listar veículos com paginação e filtros
      description: Restrito aos perfis ADMINISTRADOR e ATENDENTE.
      parameters:
        - name: pagina
          in: query
          schema:
            type: integer
            default: 0
        - name: tamanho
          in: query
          schema:
            type: integer
            default: 20
        - name: placa
          in: query
          schema:
            type: string
          description: Filtro parcial por placa
        - name: clienteId
          in: query
          schema:
            type: string
            format: uuid
          description: Filtra veículos vinculados ao cliente
        - name: incluirInativos
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Página de veículos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaVeiculosResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão

  /api/v1/veiculos/{id}:
    get:
      tags: [Veículos]
      summary: Buscar veículo por ID
      description: Restrito aos perfis ADMINISTRADOR e ATENDENTE.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: incluirInativos
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Veículo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeiculoResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Veículo não encontrado
    put:
      tags: [Veículos]
      summary: Atualizar veículo
      description: Restrito aos perfis ADMINISTRADOR e ATENDENTE.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarVeiculoRequest'
      responses:
        '200':
          description: Veículo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeiculoResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Veículo não encontrado
    delete:
      tags: [Veículos]
      summary: Remover veículo (remoção lógica)
      description: Restrito ao perfil ADMINISTRADOR.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Veículo removido
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão — requer perfil ADMINISTRADOR
        '404':
          description: Veículo não encontrado

  /api/v1/veiculos/placa/{placa}:
    get:
      tags: [Veículos]
      summary: Buscar veículo por placa
      description: Restrito aos perfis ADMINISTRADOR e ATENDENTE.
      parameters:
        - name: placa
          in: path
          required: true
          schema:
            type: string
          example: ABC1D23
        - name: incluirInativos
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Veículo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeiculoResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Veículo não encontrado

  /api/v1/veiculos/cliente/{clienteId}:
    get:
      tags: [Veículos]
      summary: Listar veículos de um cliente
      description: Restrito aos perfis ADMINISTRADOR e ATENDENTE.
      parameters:
        - name: clienteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: incluirInativos
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Veículos do cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VeiculoResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão

  /api/v1/veiculos/{id}/clientes/{clienteId}:
    post:
      tags: [Veículos]
      summary: Vincular cliente ao veículo
      description: Restrito aos perfis ADMINISTRADOR e ATENDENTE.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clienteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cliente vinculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeiculoResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Veículo ou cliente não encontrado
        '422':
          description: Regra de negócio violada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Veículos]
      summary: Desvincular cliente do veículo
      description: Restrito aos perfis ADMINISTRADOR e ATENDENTE.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clienteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cliente desvinculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeiculoResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Veículo ou cliente não encontrado
        '422':
          description: Regra de negócio violada (último cliente vinculado, por exemplo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Serviços ──────────────────────────────────────────────────────────────

  /api/v1/servicos:
    post:
      tags: [Serviços]
      summary: Cadastrar serviço no catálogo
      description: Restrito ao perfil ADMINISTRADOR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroServicoRequest'
      responses:
        '201':
          description: Serviço cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicoResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão — requer perfil ADMINISTRADOR
    get:
      tags: [Serviços]
      summary: Listar serviços com paginação e filtros
      description: Restrito aos perfis ADMINISTRADOR, ATENDENTE e MECANICO.
      parameters:
        - name: pagina
          in: query
          schema:
            type: integer
            default: 0
          description: Página solicitada (base zero)
        - name: tamanho
          in: query
          schema:
            type: integer
            default: 20
          description: Quantidade de registros por página
        - name: nome
          in: query
          schema:
            type: string
          description: Filtro parcial pelo nome do serviço
        - name: categoria
          in: query
          schema:
            $ref: '#/components/schemas/CategoriaServico'
          description: Filtro por categoria do serviço
        - name: incluirInativos
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Página de serviços
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaServicosResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão

  /api/v1/servicos/{id}:
    get:
      tags: [Serviços]
      summary: Buscar serviço por identificador
      description: Restrito aos perfis ADMINISTRADOR, ATENDENTE e MECANICO.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: incluirInativos
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Serviço encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicoResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Serviço não encontrado
    put:
      tags: [Serviços]
      summary: Atualizar serviço do catálogo
      description: Restrito ao perfil ADMINISTRADOR.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarServicoRequest'
      responses:
        '200':
          description: Serviço atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicoResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão — requer perfil ADMINISTRADOR
        '404':
          description: Serviço não encontrado
    delete:
      tags: [Serviços]
      summary: Remover serviço logicamente
      description: Restrito ao perfil ADMINISTRADOR.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Serviço removido
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão — requer perfil ADMINISTRADOR
        '404':
          description: Serviço não encontrado

  /api/v1/servicos/categoria/{categoria}:
    get:
      tags: [Serviços]
      summary: Listar serviços por categoria
      description: Restrito aos perfis ADMINISTRADOR, ATENDENTE e MECANICO.
      parameters:
        - name: categoria
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CategoriaServico'
        - name: incluirInativos
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Serviços da categoria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServicoResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão

  /api/v1/servicos/{id}/reativar:
    post:
      tags: [Serviços]
      summary: Reativar serviço previamente removido
      description: Restrito ao perfil ADMINISTRADOR.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Serviço reativado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicoResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão — requer perfil ADMINISTRADOR
        '404':
          description: Serviço não encontrado
        '422':
          description: Serviço não está em estado removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Peças e Insumos ───────────────────────────────────────────────────────

  /api/v1/pecas:
    post:
      tags: [Peças e Insumos]
      summary: Cadastrar peça ou insumo
      description: Restrito ao perfil ADMINISTRADOR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroPecaRequest'
      responses:
        '201':
          description: Peça cadastrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PecaResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão — requer perfil ADMINISTRADOR
        '422':
          description: SKU duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Peças e Insumos]
      summary: Listar peças com paginação e filtros
      description: Restrito aos perfis ADMINISTRADOR, ATENDENTE e MECANICO.
      parameters:
        - name: pagina
          in: query
          schema:
            type: integer
            default: 0
        - name: tamanho
          in: query
          schema:
            type: integer
            default: 20
        - name: nome
          in: query
          schema:
            type: string
          description: Filtro parcial pelo nome da peça
        - name: categoria
          in: query
          schema:
            type: string
          description: Filtro por categoria
        - name: incluirInativos
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Página de peças
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPecasResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão

  /api/v1/pecas/{id}:
    get:
      tags: [Peças e Insumos]
      summary: Buscar peça por ID
      description: Restrito aos perfis ADMINISTRADOR, ATENDENTE e MECANICO.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: incluirInativos
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Peça encontrada
          content:
            application/json:
              schema:
