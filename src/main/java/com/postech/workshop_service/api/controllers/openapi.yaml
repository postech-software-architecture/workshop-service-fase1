  /api/v1/orcamentos/{id}/aprovar:
    patch:
      tags: [Orçamentos]
      summary: Aprovar orçamento
      description: >
        Restrito aos perfis ADMINISTRADOR, ATENDENTE e CLIENTE.
        Registra a aprovação do cliente para o orçamento pendente, avançando a OS para AGUARDANDO_EXECUCAO.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único do orçamento
      responses:
        '200':
          description: Orçamento aprovado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrcamentoResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Orçamento não encontrado
        '422':
          description: Orçamento não está pendente de aprovação ou OS em estado inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orcamentos/{id}/rejeitar:
    patch:
      tags: [Orçamentos]
      summary: Rejeitar orçamento
      description: >
        Restrito aos perfis ADMINISTRADOR, ATENDENTE e CLIENTE.
        Registra a rejeição do cliente para o orçamento pendente, retornando a OS para EM_COMPOSICAO.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único do orçamento
      responses:
        '200':
          description: Orçamento rejeitado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrcamentoResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Orçamento não encontrado
        '422':
          description: Orçamento não está pendente de aprovação ou OS em estado inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orcamentos/{id}/cancelar:
    patch:
      tags: [Orçamentos]
      summary: Cancelar orçamento
      description: >
        Restrito aos perfis ADMINISTRADOR, ATENDENTE e CLIENTE.
        Cancela um orçamento pendente, encerra a OS vinculada e libera as reservas de estoque.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único do orçamento
      responses:
        '200':
          description: Orçamento cancelado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrcamentoResponse'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Orçamento ou ordem de serviço não encontrados
        '422':
          description: Orçamento não pode ser cancelado no estado atual da OS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Métricas ───────────────────────────────────────────────────────────────

  /api/v1/metricas/tempo-medio-execucao:
    get:
      tags: [Métricas]
      summary: Tempo médio global de execução
      description: >
        Restrito ao perfil ADMINISTRADOR. Retorna média, mínimo, máximo e total de ordens
        de serviço finalizadas ou entregues.
      responses:
        '200':
          description: Métricas globais de execução
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TempoMedioExecucaoResponse'
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado — requer perfil ADMINISTRADOR

  /api/v1/metricas/tempo-medio-execucao/por-tipo-servico:
    get:
      tags: [Métricas]
      summary: Tempo médio de execução por tipo de serviço
      description: >
        Restrito ao perfil ADMINISTRADOR. Retorna o tempo médio de execução agrupado pela
        descrição dos itens de serviço presentes na composição técnica das ordens finalizadas.
      responses:
        '200':
          description: Lista de métricas agrupadas por tipo de serviço
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TempoMedioPorTipoServicoResponse'
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado — requer perfil ADMINISTRADOR

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ── Autenticação ─────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Username ou email do usuário
          example: admin
        password:
          type: string
          format: password
          example: "senha123"

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthTokensResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          format: int64
          description: Tempo de validade do access token em segundos

    UsuarioAutenticadoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [ADMINISTRADOR, ATENDENTE, MECANICO, CLIENTE]

    # ── Clientes ──────────────────────────────────────────────────────────────

    EnderecoDTO:
      type: object
      description: Dados de endereço
      properties:
        logradouro:
          type: string
          example: Avenida Paulista
        numero:
          type: string
          example: "1000"
        complemento:
          type: string
          example: Apto 101
        bairro:
          type: string
          example: Bela Vista
        cidade:
          type: string
          example: São Paulo
        estado:
          type: string
          example: SP
        cep:
          type: string
          example: 01310-100

    CadastroClienteRequest:
      type: object
      required: [nome, documento]
      properties:
        nome:
          type: string
          example: João da Silva
        documento:
          type: string
          description: CPF ou CNPJ (com ou sem máscara)
          example: "123.456.789-01"
        email:
          type: string
          format: email
          example: joao@email.com
        telefone:
          type: string
          example: "(11) 99999-9999"
        endereco:
          $ref: '#/components/schemas/EnderecoDTO'
        dataNascimentoFundacao:
          type: string
          format: date
          example: "1990-01-01"
        observacoes:
          type: string
          example: Cliente prefere contato via WhatsApp

    AtualizarClienteRequest:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          example: João da Silva Sauro
        email:
          type: string
          format: email
          example: joao.sauro@email.com
        telefone:
          type: string
          example: "(11) 98888-8888"
        endereco:
          $ref: '#/components/schemas/EnderecoDTO'
        dataNascimentoFundacao:
          type: string
          format: date
          example: "1990-01-01"
        observacoes:
          type: string
          example: Cliente VIP

    ClienteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
          example: João da Silva
        documento:
          type: string
          description: Documento mascarado
          example: "***.456.789-**"
        email:
          type: string
          example: joao@email.com
        telefone:
          type: string
          example: "(11) 99999-9999"
        endereco:
          $ref: '#/components/schemas/EnderecoDTO'
        dataNascimentoFundacao:
          type: string
          format: date
        observacoes:
          type: string
        ativo:
          type: boolean
          example: true
        dataCriacao:
          type: string
          format: date-time
        dataUltimaAtualizacao:
          type: string
          format: date-time
        dataRemocao:
          type: string
          format: date-time
          nullable: true

    # ── Veículos ──────────────────────────────────────────────────────────────

    CadastroVeiculoRequest:
      type: object
      required: [placa, marca, modelo, ano, clientesIds]
      properties:
        placa:
          type: string
          maxLength: 10
          example: BRA1D23
        marca:
          type: string
          maxLength: 60
          example: Toyota
        modelo:
          type: string
          maxLength: 80
          example: Corolla
        ano:
          type: integer
          minimum: 1900
          maximum: 3000
          example: 2020
        clientesIds:
          type: array
          minItems: 1
          description: Lista de clientes vinculados ao veículo
          items:
            type: string
            format: uuid
        cor:
          type: string
          maxLength: 30
          example: Prata
        observacoes:
          type: string
          maxLength: 2000
          example: Veículo compartilhado entre familiares

    AtualizarVeiculoRequest:
      type: object
      required: [placa, marca, modelo, ano]
      properties:
        placa:
          type: string
          maxLength: 10
          example: BRA1D23
        marca:
          type: string
          maxLength: 60
          example: Toyota
        modelo:
          type: string
          maxLength: 80
          example: Corolla
        ano:
          type: integer
          minimum: 1900
          maximum: 3000
          example: 2020
        cor:
          type: string
          maxLength: 30
          example: Prata
        observacoes:
          type: string
          maxLength: 2000

    ClienteVinculadoResponse:
      type: object
      description: Cliente vinculado ao veículo
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
          example: João da Silva
        documentoMascarado:
          type: string
          example: "***.654.321-**"

    VeiculoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        placa:
          type: string
          example: ABC1D23
        marca:
          type: string
        modelo:
          type: string
        ano:
          type: integer
        cor:
          type: string
        observacoes:
          type: string
        clientes:
          type: array
          items:
            $ref: '#/components/schemas/ClienteVinculadoResponse'
        ativo:
          type: boolean
        dataCriacao:
          type: string
          format: date-time
        dataUltimaAtualizacao:
          type: string
          format: date-time
        dataRemocao:
          type: string
          format: date-time
          nullable: true

    PaginaVeiculosResponse:
      type: object
      properties:
        conteudo:
          type: array
          items:
            $ref: '#/components/schemas/VeiculoResponse'
        pagina:
          type: integer
        tamanho:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    # ── Serviços ──────────────────────────────────────────────────────────────

    CategoriaServico:
      type: string
      enum: [MECANICA, ELETRICA, ESTETICA, PREVENTIVA]

    NivelComplexidade:
      type: string
      enum: [BAIXA, MEDIA, ALTA]

    CadastroServicoRequest:
      type: object
      required: [nome, descricao, valor]
      properties:
        nome:
          type: string
          maxLength: 100
          example: Troca de óleo
        descricao:
          type: string
          example: Substituição do óleo do motor e filtro de óleo
        valor:
          type: number
          format: decimal
          example: 150.00
        categoria:
          $ref: '#/components/schemas/CategoriaServico'
        nivelComplexidade:
          $ref: '#/components/schemas/NivelComplexidade'
        garantiaDias:
          type: integer
          minimum: 1
          example: 30
        observacoesTecnicas:
          type: string
          example: Utilizar óleo sintético 5W30 conforme manual do fabricante

    AtualizarServicoRequest:
      type: object
      required: [nome, descricao, valor]
      properties:
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
        valor:
          type: number
          format: decimal
        categoria:
          $ref: '#/components/schemas/CategoriaServico'
        nivelComplexidade:
          $ref: '#/components/schemas/NivelComplexidade'
        garantiaDias:
          type: integer
        observacoesTecnicas:
          type: string

    ServicoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        descricao:
          type: string
        valor:
          type: number
        categoria:
          $ref: '#/components/schemas/CategoriaServico'
        nivelComplexidade:
          $ref: '#/components/schemas/NivelComplexidade'
        garantiaDias:
          type: integer
        observacoesTecnicas:
          type: string
        ativo:
          type: boolean
        dataCriacao:
          type: string
          format: date-time
        dataUltimaAtualizacao:
          type: string
          format: date-time
        dataRemocao:
          type: string
          format: date-time
          nullable: true

    PaginaServicosResponse:
      type: object
      properties:
        conteudo:
          type: array
          items:
            $ref: '#/components/schemas/ServicoResponse'
        pagina:
          type: integer
        tamanho:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    # ── Peças e Insumos ───────────────────────────────────────────────────────

    CadastroPecaRequest:
      type: object
      required: [sku, nome, valorUnitario, estoqueMinimo, unidadeMedida, tipoItem]
      properties:
        sku:
          type: string
          maxLength: 50
          example: FIL-001
        nome:
          type: string
          maxLength: 200
          example: Filtro de oleo 5W30
        valorUnitario:
          type: number
          example: 45.90
        estoqueMinimo:
          type: number
          example: 5
        unidadeMedida:
          type: string
          enum: [UN, L, KG, M, ML, CX, PC]
          example: UN
        tipoItem:
          type: string
          enum: [PECA, INSUMO]
          example: PECA
        fornecedor:
          type: string
          maxLength: 200
          example: Bosch
        codigoBarras:
          type: string
          maxLength: 50
          example: "7891234567890"
        marca:
          type: string
          maxLength: 100
          example: Bosch
        categoria:
          type: string
          maxLength: 100
          example: Filtros
        aplicacao:
          type: string
          maxLength: 500
          example: Hatch compacto ate 2.0
        observacoes:
          type: string
          example: Compativel com Gol, Fox e Polo

    AtualizarPecaRequest:
      type: object
      required: [nome, valorUnitario, estoqueMinimo, unidadeMedida, tipoItem]
      properties:
        nome:
          type: string
          maxLength: 200
        valorUnitario:
          type: number
        estoqueMinimo:
          type: number
        unidadeMedida:
          type: string
          enum: [UN, L, KG, M, ML, CX, PC]
        tipoItem:
          type: string
          enum: [PECA, INSUMO]
        fornecedor:
          type: string
        codigoBarras:
          type: string
        marca:
          type: string
        categoria:
          type: string
        aplicacao:
          type: string
        observacoes:
          type: string

    PecaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          example: FIL-001
        nome:
          type: string
        valorUnitario:
          type: number
        estoqueMinimo:
          type: number
        unidadeMedida:
          type: string
          enum: [UN, L, KG, M, ML, CX, PC]
        tipoItem:
          type: string
          enum: [PECA, INSUMO]
        fornecedor:
          type: string
        codigoBarras:
          type: string
        marca:
          type: string
        categoria:
          type: string
        aplicacao:
          type: string
        observacoes:
          type: string
        ativo:
          type: boolean
        quantidadeTotal:
          type: number
          description: Soma das quantidades em todos os estoques da peça
          example: 12.500
        versao:
          type: integer
        dataCriacao:
          type: string
          format: date-time
        dataUltimaAtualizacao:
          type: string
          format: date-time
        dataRemocao:
          type: string
          format: date-time
          nullable: true

    PaginaPecasResponse:
      type: object
      properties:
        conteudo:
          type: array
          items:
            $ref: '#/components/schemas/PecaResponse'
        pagina:
          type: integer
        tamanho:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    # ── Estoques ──────────────────────────────────────────────────────────────

    CriarEstoqueRequest:
      type: object
      required: [pecaInsumoId, localizacao, quantidade]
      properties:
        pecaInsumoId:
          type: string
          format: uuid
        localizacao:
          type: string
          maxLength: 100
          example: Prateleira A2
        quantidade:
          type: number
          minimum: 0
          example: 10

    EstoqueResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pecaInsumoId:
          type: string
          format: uuid
        localizacao:
          type: string
          example: Prateleira A2
        quantidade:
          type: number
          example: 10.500
        ativo:
          type: boolean
        versao:
          type: integer
        dataCriacao:
          type: string
          format: date-time
        dataUltimaAtualizacao:
          type: string
          format: date-time

    MovimentacaoRequest:
      type: object
      required: [estoqueId, tipo, quantidade]
      properties:
        estoqueId:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [ENTRADA, SAIDA]
          description: Tipos RESERVA, LIBERACAO e AJUSTE são internos e não são aceitos neste endpoint
        quantidade:
          type: number
          example: 5
        motivo:
          type: string
          maxLength: 500
          example: Compra de reposicao

    MovimentacaoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        estoqueId:
          type: string
          format: uuid
        ordemServicoId:
          type: string
          format: uuid
          nullable: true
        orcamentoId:
          type: string
          format: uuid
          nullable: true
        tipo:
          type: string
          enum: [ENTRADA, SAIDA, AJUSTE, RESERVA, LIBERACAO]
        quantidade:
          type: number
        quantidadeAnterior:
          type: number
        quantidadePosterior:
          type: number
        motivo:
          type: string
          nullable: true
        dataMovimentacao:
          type: string
          format: date-time

    # ── Ordens de Serviço ─────────────────────────────────────────────────────

    StatusOrdemServico:
      type: string
      enum:
        - EM_COMPOSICAO
        - AGUARDANDO_APROVACAO
        - AGUARDANDO_EXECUCAO
        - EM_EXECUCAO
        - CANCELADA
        - FINALIZADA
        - ENTREGUE

    TipoItemComposicaoTecnica:
      type: string
      enum: [SERVICO, PECA, INSUMO]

    DadosVeiculoRequest:
      type: object
      description: Dados para cadastro do veículo caso não exista no sistema
      required: [marca, modelo, ano]
      properties:
        marca:
          type: string
          example: Toyota
        modelo:
          type: string
          example: Corolla
        ano:
          type: integer
          minimum: 1
          example: 2020

    ItemServicoRequest:
      type: object
      required: [servicoId]
      properties:
        servicoId:
          type: string
          format: uuid
          description: UUID do serviço no catálogo
        quantidade:
          type: integer
          minimum: 1
          example: 1

    ItemPecaRequest:
      type: object
      required: [pecaId, quantidade]
      properties:
        pecaId:
          type: string
          format: uuid
          description: UUID da peça no catálogo
        quantidade:
          type: number
          minimum: 0.01
          example: 2.0

    AdicionarItemOrdemServicoRequest:
      type: object
      description: Dados para adicionar serviço ou peça à composição técnica da OS
      required: [tipo]
      properties:
        tipo:
          type: string
          enum: [SERVICO, PECA]
          description: Tipo do item a adicionar
          example: SERVICO
        servicoId:
          type: string
          format: uuid
          nullable: true
          description: Identificador do serviço do catálogo, obrigatório para tipo SERVICO
        pecaId:
          type: string
          format: uuid
          nullable: true
          description: Identificador da peça do catálogo, obrigatório para tipo PECA
        quantidade:
          type: number
          minimum: 0.01
          nullable: true
          description: Quantidade do item; para serviços, quando omitida, o domínio assume 1
          example: 1

    CriarOrdemServicoRequest:
      type: object
      required: [clienteDocumento, veiculoPlaca, servicos]
      properties:
        clienteDocumento:
          type: string
          description: CPF ou CNPJ do cliente (com ou sem máscara)
          example: "123.456.789-09"
        veiculoPlaca:
          type: string
          description: Placa do veículo (formato Mercosul ou antigo)
          example: ABC1D23
        veiculo:
          $ref: '#/components/schemas/DadosVeiculoRequest'
        servicos:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemServicoRequest'
        pecas:
          type: array
          items:
            $ref: '#/components/schemas/ItemPecaRequest'
        observacoes:
          type: string
          description: Observações do atendente sobre o veículo ou relato do cliente
          example: Cliente relatou barulho ao frear

    ClienteResumoOSResponse:
      type: object
      description: Dados resumidos do cliente vinculado à OS
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
          example: Joao da Silva
        documentoMascarado:
          type: string
          example: "123.456.789-09"

    VeiculoResumoOSResponse:
      type: object
      description: Dados resumidos do veículo vinculado à OS
      properties:
        id:
          type: string
          format: uuid
        placa:
          type: string
          example: ABC1D23
        marca:
          type: string
        modelo:
          type: string
        ano:
          type: integer

    OrcamentoResumoOSResponse:
      type: object
      description: Resumo do orçamento gerado na criação da OS
      properties:
        id:
          type: string
          format: uuid
        valorTotal:
          type: number
          example: 310.00
        status:
          $ref: '#/components/schemas/StatusOrcamento'
        dataCriacao:
          type: string
          format: date-time

    OrdemServicoResponse:
      type: object
      description: Dados da Ordem de Serviço
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          description: Número sequencial da OS
          example: OS-2026-00001
        status:
          $ref: '#/components/schemas/StatusOrdemServico'
        cliente:
          $ref: '#/components/schemas/ClienteResumoOSResponse'
        veiculo:
          $ref: '#/components/schemas/VeiculoResumoOSResponse'
        orcamento:
          $ref: '#/components/schemas/OrcamentoResumoOSResponse'
        observacoes:
          type: string
        dataCriacao:
          type: string
          format: date-time
        dataUltimaAtualizacao:
          type: string
          format: date-time
        dataInicioExecucao:
          type: string
          format: date-time
          nullable: true
        dataFinalizacao:
          type: string
          format: date-time
          nullable: true
        dataEntrega:
          type: string
          format: date-time
          nullable: true

    ItemComposicaoResponse:
      type: object
      description: Item da composição técnica registrado na ordem
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único do item
        tipo:
          $ref: '#/components/schemas/TipoItemComposicaoTecnica'
        descricao:
          type: string
        valor:
          type: number
          example: 150.00
        idPecaInsumo:
          type: string
          format: uuid
          nullable: true
          description: Identificador da peça/insumo (apenas itens do tipo PECA ou INSUMO)
        idServico:
          type: string
          format: uuid
          nullable: true
          description: Identificador do serviço do catálogo (apenas itens do tipo SERVICO)
        statusExecucao:
          type: string
          enum: [PENDENTE, EM_EXECUCAO, FINALIZADO]
          nullable: true
          description: Status de execução individual do serviço (apenas itens do tipo SERVICO)
        dataInicioExecucao:
          type: string
          format: date-time
          nullable: true
          description: Data e hora de início da execução do serviço pelo mecânico
        dataFinalizacao:
          type: string
          format: date-time
          nullable: true
          description: Data e hora de finalização da execução do serviço pelo mecânico

