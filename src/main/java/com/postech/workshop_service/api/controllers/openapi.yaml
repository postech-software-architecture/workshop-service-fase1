openapi: 3.0.3
info:
  title: Workshop Service API
  description: API REST de gestão de oficina mecânica — Spring Boot 3.4.1
  version: 1.0.0

tags:
  - name: Clientes
    description: Cadastro e gestão de clientes
  - name: Veículos
    description: Cadastro e gestão de veículos
  - name: Serviços
    description: Catálogo de serviços da oficina
  - name: Peças e Insumos
    description: Catálogo de peças e insumos
  - name: Estoques
    description: Controle de estoque e movimentações
  - name: Ordens de Serviço
    description: Gerenciamento do ciclo de vida das ordens de serviço
  - name: Orçamentos
    description: Aprovação e rejeição de orçamentos vinculados a ordens de serviço

paths:

  # ─── Clientes ──────────────────────────────────────────────────────────────

  /api/v1/clientes:
    post:
      tags: [Clientes]
      summary: Cadastrar cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroClienteRequest'
      responses:
        '201':
          description: Cliente cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '400':
          description: Dados inválidos
        '422':
          description: Regra de negócio violada (CPF/CNPJ duplicado)
    get:
      tags: [Clientes]
      summary: Listar todos os clientes
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClienteResponse'

  /api/v1/clientes/{id}:
    get:
      tags: [Clientes]
      summary: Buscar cliente por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '404':
          description: Cliente não encontrado
    put:
      tags: [Clientes]
      summary: Atualizar dados do cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarClienteRequest'
      responses:
        '200':
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '404':
          description: Cliente não encontrado
    delete:
      tags: [Clientes]
      summary: Remover cliente (remoção lógica)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Cliente removido
        '404':
          description: Cliente não encontrado

  /api/v1/clientes/documento/{documento}:
    get:
      tags: [Clientes]
      summary: Buscar cliente por CPF ou CNPJ
      parameters:
        - name: documento
          in: path
          required: true
          schema:
            type: string
          description: CPF ou CNPJ com ou sem máscara
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '404':
          description: Cliente não encontrado

  # ─── Veículos ──────────────────────────────────────────────────────────────

  /api/v1/veiculos:
    post:
      tags: [Veículos]
      summary: Cadastrar veículo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroVeiculoRequest'
      responses:
        '201':
          description: Veículo cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeiculoResponse'
        '400':
          description: Dados inválidos
        '422':
          description: Placa duplicada
    get:
      tags: [Veículos]
      summary: Listar veículos (paginado)
      responses:
        '200':
          description: Página de veículos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaVeiculosResponse'

  /api/v1/veiculos/{id}:
    get:
      tags: [Veículos]
      summary: Buscar veículo por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Veículo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeiculoResponse'
        '404':
          description: Veículo não encontrado
    put:
      tags: [Veículos]
      summary: Atualizar veículo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarVeiculoRequest'
      responses:
        '200':
          description: Veículo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeiculoResponse'
        '404':
          description: Veículo não encontrado
    delete:
      tags: [Veículos]
      summary: Remover veículo (remoção lógica)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Veículo removido
        '404':
          description: Veículo não encontrado

  /api/v1/veiculos/placa/{placa}:
    get:
      tags: [Veículos]
      summary: Buscar veículo por placa
      parameters:
        - name: placa
          in: path
          required: true
          schema:
            type: string
          example: ABC1D23
      responses:
        '200':
          description: Veículo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeiculoResponse'
        '404':
          description: Veículo não encontrado

  /api/v1/veiculos/cliente/{clienteId}:
    get:
      tags: [Veículos]
      summary: Listar veículos de um cliente
      parameters:
        - name: clienteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Veículos do cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VeiculoResponse'

  /api/v1/veiculos/{id}/clientes/{clienteId}:
    post:
      tags: [Veículos]
      summary: Vincular cliente ao veículo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clienteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cliente vinculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeiculoResponse'
        '404':
          description: Veículo ou cliente não encontrado
    delete:
      tags: [Veículos]
      summary: Desvincular cliente do veículo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clienteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cliente desvinculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeiculoResponse'
        '404':
          description: Veículo ou cliente não encontrado

  # ─── Serviços ──────────────────────────────────────────────────────────────

  /api/v1/servicos:
    post:
      tags: [Serviços]
      summary: Cadastrar serviço no catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroServicoRequest'
      responses:
        '201':
          description: Serviço cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicoResponse'
        '400':
          description: Dados inválidos
    get:
      tags: [Serviços]
      summary: Listar serviços (paginado)
      responses:
        '200':
          description: Página de serviços
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaServicosResponse'

  /api/v1/servicos/{id}:
    get:
      tags: [Serviços]
      summary: Buscar serviço por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Serviço encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicoResponse'
        '404':
          description: Serviço não encontrado
    put:
      tags: [Serviços]
      summary: Atualizar serviço
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarServicoRequest'
      responses:
        '200':
          description: Serviço atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicoResponse'
        '404':
          description: Serviço não encontrado
    delete:
      tags: [Serviços]
      summary: Remover serviço do catálogo (remoção lógica)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Serviço removido
        '404':
          description: Serviço não encontrado

  /api/v1/servicos/categoria/{categoria}:
    get:
      tags: [Serviços]
      summary: Listar serviços por categoria
      parameters:
        - name: categoria
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Serviços da categoria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServicoResponse'

  /api/v1/servicos/{id}/reativar:
    post:
      tags: [Serviços]
      summary: Reativar serviço removido
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Serviço reativado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicoResponse'
        '404':
          description: Serviço não encontrado

  # ─── Peças e Insumos ───────────────────────────────────────────────────────

  /api/v1/pecas:
    post:
      tags: [Peças e Insumos]
      summary: Cadastrar peça ou insumo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroPecaRequest'
      responses:
        '201':
          description: Peça cadastrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PecaResponse'
        '400':
          description: Dados inválidos
        '422':
          description: SKU duplicado
    get:
      tags: [Peças e Insumos]
      summary: Listar peças (paginado)
      responses:
        '200':
          description: Página de peças
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPecasResponse'

  /api/v1/pecas/{id}:
    get:
      tags: [Peças e Insumos]
      summary: Buscar peça por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Peça encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PecaResponse'
        '404':
          description: Peça não encontrada
    put:
      tags: [Peças e Insumos]
      summary: Atualizar peça
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarPecaRequest'
      responses:
        '200':
          description: Peça atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PecaResponse'
        '404':
          description: Peça não encontrada
    delete:
      tags: [Peças e Insumos]
      summary: Remover peça (remoção lógica)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Peça removida
        '404':
          description: Peça não encontrada

  /api/v1/pecas/sku/{sku}:
    get:
      tags: [Peças e Insumos]
      summary: Buscar peça por SKU
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Peça encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PecaResponse'
        '404':
          description: Peça não encontrada

  /api/v1/pecas/estoques:
    post:
      tags: [Peças e Insumos]
      summary: Criar estoque para uma peça
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarEstoqueRequest'
      responses:
        '201':
          description: Estoque criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstoqueResponse'
        '400':
          description: Dados inválidos
        '404':
          description: Peça não encontrada

  # ─── Estoques ──────────────────────────────────────────────────────────────

  /api/v1/estoques/movimentacoes:
    post:
      tags: [Estoques]
      summary: Registrar movimentação de estoque (entrada ou saída)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovimentacaoRequest'
      responses:
        '201':
          description: Movimentação registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovimentacaoResponse'
        '400':
          description: Dados inválidos
        '404':
          description: Estoque não encontrado
        '422':
          description: Estoque insuficiente para saída

  /api/v1/estoques/movimentacoes/ordem-servico/{ordemServicoId}:
    get:
      tags: [Estoques]
      summary: Consultar movimentacoes de estoque por ordem de servico
      parameters:
        - name: ordemServicoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Movimentacoes vinculadas a ordem
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovimentacaoResponse'
        '404':
          description: Ordem de servico nao encontrada

  /api/v1/estoques/{id}:
    get:
      tags: [Estoques]
      summary: Buscar estoque por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estoque encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstoqueResponse'
        '404':
          description: Estoque não encontrado

  /api/v1/estoques/peca/{pecaInsumoId}:
    get:
      tags: [Estoques]
      summary: Listar todos os estoques de uma peça
      parameters:
        - name: pecaInsumoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estoques da peça
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstoqueResponse'

  # ─── Ordens de Serviço ─────────────────────────────────────────────────────

  /api/v1/ordens-servico:
    post:
      tags: [Ordens de Serviço]
      summary: Abrir Ordem de Serviço
      description: >
        Registra a recepção do veículo, identifica o cliente, calcula o orçamento
        automaticamente e envia para aprovação do cliente. Se o veículo não existir
        no sistema, é cadastrado automaticamente com os dados informados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarOrdemServicoRequest'
            examples:
              com_servico_e_peca:
                summary: OS com serviço e peça
                value:
                  clienteDocumento: "123.456.789-09"
                  veiculoPlaca: "ABC1D23"
                  veiculo:
                    marca: "Toyota"
                    modelo: "Corolla"
                    ano: 2020
                  servicos:
                    - servicoId: "00000000-0000-0000-0000-000000000001"
                      quantidade: 1
                  pecas:
                    - pecaId: "00000000-0000-0000-0000-000000000002"
                      quantidade: 2.0
                  observacoes: "Cliente relatou barulho ao frear"
              veiculo_ja_cadastrado:
                summary: OS com veículo já existente
                value:
                  clienteDocumento: "98765432100"
                  veiculoPlaca: "XYZ9G87"
                  servicos:
                    - servicoId: "00000000-0000-0000-0000-000000000001"
                      quantidade: 1
      responses:
        '201':
          description: OS criada com sucesso — orçamento pendente de aprovação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponse'
        '400':
          description: Dados de entrada inválidos (campos obrigatórios ausentes)
        '404':
          description: Cliente ou serviço não encontrado no sistema
        '422':
          description: >
            Regra de negócio violada:
            - veículo pertence a outro cliente
            - veículo não encontrado e dados para cadastro ausentes
            - estoque insuficiente para a peça solicitada
            - serviço inativo no catálogo

  # ─── Ordens de Serviço ────────────────────────────────────────────────────────

  /api/v1/ordens-servico/{id}/iniciar-execucao:
    patch:
      tags: [Ordens de Serviço]
      summary: Iniciar execucao da OS
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Execucao iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponse'
        '404':
          description: Ordem de servico nao encontrada
        '422':
          description: Ordem de servico nao esta aguardando execucao

  /api/v1/ordens-servico/{id}/finalizar-execucao:
    patch:
      tags: [Ordens de Serviço]
      summary: Finalizar execucao da OS
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Execucao finalizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponse'
        '404':
          description: Ordem de servico nao encontrada
        '422':
          description: Ordem de servico nao esta em execucao

  /api/v1/ordens-servico/{id}/entregar:
    patch:
      tags: [Ordens de Serviço]
      summary: Registrar entrega do veiculo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Veiculo entregue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponse'
        '404':
          description: Ordem de servico nao encontrada
        '422':
          description: Ordem de servico nao esta finalizada

  /api/v1/ordens-servico/{id}/historico-status:
    get:
      tags: [Ordens de Serviço]
      summary: Consultar historico de status da OS
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Historico cronologico da OS
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoricoStatusOrdemServicoResponse'
        '404':
          description: Ordem de servico nao encontrada

  /api/v1/orcamentos/{id}/aprovar:
    patch:
      tags: [Orçamentos]
      summary: Aprovar orçamento
      description: >
        Registra a aprovação do cliente para o orçamento pendente.
        A ordem de serviço avança para o status AGUARDANDO_EXECUCAO.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único do orçamento
      responses:
        '200':
          description: Orçamento aprovado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrcamentoResponse'
        '404':
          description: Orçamento não encontrado
        '422':
          description: Orçamento não está pendente de aprovação ou OS em estado inválido

  /api/v1/orcamentos/{id}/rejeitar:
    patch:
      tags: [Orçamentos]
      summary: Rejeitar orçamento
      description: >
        Registra a rejeição do cliente para o orçamento pendente.
        A ordem de serviço retorna ao status EM_COMPOSICAO para revisão.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único do orçamento
      responses:
        '200':
          description: Orçamento rejeitado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrcamentoResponse'
        '404':
          description: Orçamento não encontrado
        '422':
          description: Orçamento não está pendente de aprovação ou OS em estado inválido

components:
  schemas:

    # ── Clientes ──────────────────────────────────────────────────────────────

    CadastroClienteRequest:
      type: object
      required: [nome, documento]
      properties:
        nome:
          type: string
          example: João Silva
        documento:
          type: string
          description: CPF ou CNPJ sem máscara
          example: "12345678909"
        telefone:
          type: string
          example: "(11) 99999-9999"
        email:
          type: string
          format: email

    AtualizarClienteRequest:
      type: object
      properties:
        nome:
          type: string
        telefone:
          type: string
        email:
          type: string
          format: email

    ClienteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        documento:
          type: string
          description: Documento mascarado (ex. 123.456.789-09)
        ativo:
          type: boolean
        dataCriacao:
          type: string
          format: date-time

    # ── Veículos ──────────────────────────────────────────────────────────────

    CadastroVeiculoRequest:
      type: object
      required: [placa, marca, modelo, ano]
      properties:
        placa:
          type: string
          example: ABC1D23
        marca:
          type: string
          example: Toyota
        modelo:
          type: string
          example: Corolla
        ano:
          type: integer
          example: 2020
        clienteId:
          type: string
          format: uuid

    AtualizarVeiculoRequest:
      type: object
      properties:
        marca:
          type: string
        modelo:
          type: string
        ano:
          type: integer

    VeiculoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        placa:
          type: string
        marca:
          type: string
        modelo:
          type: string
        ano:
          type: integer
        clientesVinculados:
          type: array
          items:
            type: string
            format: uuid

    PaginaVeiculosResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/VeiculoResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer

    # ── Serviços ──────────────────────────────────────────────────────────────

    CadastroServicoRequest:
      type: object
      required: [nome, descricao, valor]
      properties:
        nome:
          type: string
          example: Troca de óleo
        descricao:
          type: string
        valor:
          type: number
          format: decimal
          example: 100.00
        categoria:
          type: string
        nivelComplexidade:
          type: string
        garantiaDias:
          type: integer

    AtualizarServicoRequest:
      type: object
      properties:
        nome:
          type: string
        descricao:
          type: string
        valor:
          type: number
        categoria:
          type: string

    ServicoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        descricao:
          type: string
        valor:
          type: number
        categoria:
          type: string
        ativo:
          type: boolean

    PaginaServicosResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ServicoResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer

    # ── Peças e Insumos ───────────────────────────────────────────────────────

    CadastroPecaRequest:
      type: object
      required: [sku, nome, valorUnitario, estoqueMinimo, unidadeMedida, tipoItem]
      properties:
        sku:
          type: string
          example: OLEO-5W30
        nome:
          type: string
          example: Óleo 5W30
        valorUnitario:
          type: number
          example: 45.00
        estoqueMinimo:
          type: number
          example: 5.0
        unidadeMedida:
          type: string
          enum: [UN, L, KG, M, M2, M3, CX]
        tipoItem:
          type: string
          enum: [PECA, INSUMO]

    AtualizarPecaRequest:
      type: object
      properties:
        nome:
          type: string
        valorUnitario:
          type: number
        estoqueMinimo:
          type: number
        unidadeMedida:
          type: string

    PecaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        nome:
          type: string
        valorUnitario:
          type: number
        estoqueMinimo:
          type: number
        unidadeMedida:
          type: string
        tipoItem:
          type: string
        ativo:
          type: boolean

    PaginaPecasResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PecaResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer

    CriarEstoqueRequest:
      type: object
      required: [pecaInsumoId, localizacao, quantidade]
      properties:
        pecaInsumoId:
          type: string
          format: uuid
        localizacao:
          type: string
          example: Prateleira A1
        quantidade:
          type: number
          example: 10.0

    EstoqueResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pecaInsumoId:
          type: string
          format: uuid
        localizacao:
          type: string
        quantidade:
          type: number

    MovimentacaoRequest:
      type: object
      required: [estoqueId, tipo, quantidade]
      properties:
        estoqueId:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [ENTRADA, SAIDA]
          description: Movimentacoes RESERVA, LIBERACAO e AJUSTE sao internas e nao entram neste endpoint
        quantidade:
          type: number
          example: 2.0
        motivo:
          type: string

    MovimentacaoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        estoqueId:
          type: string
          format: uuid
        ordemServicoId:
          type: string
          format: uuid
          nullable: true
        orcamentoId:
          type: string
          format: uuid
          nullable: true
        tipo:
          type: string
        quantidade:
          type: number
        quantidadeAnterior:
          type: number
        quantidadePosterior:
          type: number
        motivo:
          type: string
          nullable: true
        dataMovimentacao:
          type: string
          format: date-time

    # ── Ordens de Serviço ─────────────────────────────────────────────────────

    CriarOrdemServicoRequest:
      type: object
      required: [clienteDocumento, veiculoPlaca, servicos]
      properties:
        clienteDocumento:
          type: string
          description: CPF ou CNPJ do cliente (com ou sem máscara)
          example: "123.456.789-09"
        veiculoPlaca:
          type: string
          description: Placa do veículo (formato Mercosul ou antigo)
          example: ABC1D23
        veiculo:
          $ref: '#/components/schemas/DadosVeiculoRequest'
        servicos:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemServicoRequest'
        pecas:
          type: array
          items:
            $ref: '#/components/schemas/ItemPecaRequest'
        observacoes:
          type: string
          description: Observações do atendente sobre o veículo ou relato do cliente
          example: Cliente relatou barulho ao frear

    DadosVeiculoRequest:
      type: object
      description: Dados para cadastro do veículo caso não exista no sistema
      required: [marca, modelo, ano]
      properties:
        marca:
          type: string
          example: Toyota
        modelo:
          type: string
          example: Corolla
        ano:
          type: integer
          example: 2020

    ItemServicoRequest:
      type: object
      required: [servicoId, quantidade]
      properties:
        servicoId:
          type: string
          format: uuid
          description: UUID do serviço no catálogo
        quantidade:
          type: integer
          minimum: 1
          example: 1

    ItemPecaRequest:
      type: object
      required: [pecaId, quantidade]
      properties:
        pecaId:
          type: string
          format: uuid
          description: UUID da peça no catálogo
        quantidade:
          type: number
          minimum: 0.01
          example: 2.0

    OrdemServicoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          description: Número sequencial único no formato OS-{ANO}-{NNNNN}
          example: OS-2026-00001
        status:
          type: string
          enum: [EM_COMPOSICAO, AGUARDANDO_RESPOSTA_CLIENTE, AGUARDANDO_EXECUCAO, EM_EXECUCAO, CANCELADA, FINALIZADA, ENTREGUE]
          example: AGUARDANDO_RESPOSTA_CLIENTE
        cliente:
          $ref: '#/components/schemas/ClienteResumoResponse'
        veiculo:
          $ref: '#/components/schemas/VeiculoResumoResponse'
        orcamento:
          $ref: '#/components/schemas/OrcamentoResumoResponse'
        observacoes:
          type: string
        dataCriacao:
          type: string
          format: date-time
        dataUltimaAtualizacao:
          type: string
          format: date-time
        dataInicioExecucao:
          type: string
          format: date-time
        dataFinalizacao:
          type: string
          format: date-time
        dataEntrega:
          type: string
          format: date-time

    HistoricoStatusOrdemServicoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        idOrdemServico:
          type: string
          format: uuid
        statusAnterior:
          type: string
          enum: [EM_COMPOSICAO, AGUARDANDO_RESPOSTA_CLIENTE, AGUARDANDO_EXECUCAO, EM_EXECUCAO, CANCELADA, FINALIZADA, ENTREGUE]
        statusNovo:
          type: string
          enum: [EM_COMPOSICAO, AGUARDANDO_RESPOSTA_CLIENTE, AGUARDANDO_EXECUCAO, EM_EXECUCAO, CANCELADA, FINALIZADA, ENTREGUE]
        dataTransicao:
          type: string
          format: date-time
        idUsuario:
          type: string
          format: uuid
        usernameUsuario:
          type: string

    ClienteResumoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        documentoMascarado:
          type: string
          example: "123.456.789-09"

    VeiculoResumoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        placa:
          type: string
          example: ABC1D23
        marca:
          type: string
        modelo:
          type: string
        ano:
          type: integer

    OrcamentoResumoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        valorTotal:
          type: number
          example: 180.00
        status:
          type: string
          enum: [CRIADO, PENDENTE_APROVACAO, APROVADO, REJEITADO, CANCELADO]
          example: PENDENTE_APROVACAO
        dataCriacao:
          type: string
          format: date-time

    # ── Orçamentos ────────────────────────────────────────────────────────────

    OrcamentoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        idOrdemServico:
          type: string
          format: uuid
        valorTotal:
          type: number
          example: 310.00
        status:
          type: string
          enum: [CRIADO, PENDENTE_APROVACAO, APROVADO, REJEITADO, CANCELADO]
          example: APROVADO
        tipo:
          type: string
          enum: [SERVICO_ORIGINAL, ADICAO_SERVICO]
          example: SERVICO_ORIGINAL
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemOrcamentoResponse'
        dataCriacao:
          type: string
          format: date-time
        dataUltimaAtualizacao:
          type: string
          format: date-time

    ItemOrcamentoResponse:
      type: object
      properties:
        descricao:
          type: string
          example: Troca de óleo
        valor:
          type: number
          example: 100.00
