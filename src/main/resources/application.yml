spring:
  application:
    name: workshop-service
  datasource:
    url: jdbc:postgresql://localhost:5433/mydatabase
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
seguranca:
  jwt:
    # Sem default: o segredo e OBRIGATORIO via env JWT_SECRET (fail-fast se ausente/curto).
    # Nao commitar segredo real — repo publico. Prod/EKS injeta via k8s Secret; dev via
    # overlay dev/secret.env; testes via src/test/resources/application.yml.
    secret: ${JWT_SECRET}
    expiracao-access-segundos: ${JWT_ACCESS_EXPIRATION_SECONDS:3600}
    expiracao-refresh-dias: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    issuer: ${JWT_ISSUER:workshop-auth}
    audience: ${JWT_AUDIENCE:workshop-service}
webhook:
  orcamento:
    token: ${WEBHOOK_ORCAMENTO_TOKEN:}
notificacao:
  email:
    remetente: ${MAIL_FROM:no-reply@workshop.local}
management:
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:}
        # A New Relic soma contadores OTLP por delta. Com a temporalidade
        # cumulativa, que e o padrao do Micrometer, as amostras chegam mas
        # sum() devolve zero: os paineis de ordem de servico mostravam a
        # metrica existindo e sem valor.
        aggregation-temporality: ${OTEL_METRICS_TEMPORALITY:delta}
  observations:
    key-values:
      service.name: ${OTEL_SERVICE_NAME:workshop-service}
      deployment.environment: ${OTEL_ENVIRONMENT:local}
otel:
  environment: ${OTEL_ENVIRONMENT:${spring.profiles.active:local}}
  service:
    name: ${OTEL_SERVICE_NAME:workshop-service}
    version: ${OTEL_SERVICE_VERSION:unknown}
  sdk:
    enabled: ${OTEL_SDK_ENABLED:false}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:none}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:none}
